spring:
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
  datasource:
    url: jdbc:h2:mem:glxt_api;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    druid:
      validation-query: SELECT 1
  h2:
    console:
      enabled: true

logging:
  level:
    com.alibaba.nacos: off
